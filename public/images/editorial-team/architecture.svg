<path d="M232 253H272"/><path d="M464 253H520"/><path d="M748 253H942"/>
<path d="M634 290V366"/><path d="M748 403H800"/><path d="M896 440V471H942"/>
</g>
<rect class="node" x="72" y="216" width="160" height="74" rx="5"/>
<text x="92" y="247" class="name">Telegram</text><text x="92" y="270" class="sub">User messages</text>
<rect class="node" x="272" y="216" width="192" height="74" rx="5"/>
<text x="292" y="247" class="name">Runtime queue</text><text x="292" y="270" class="sub">Allowlist · single worker</text>
<rect x="520" y="216" width="228" height="74" rx="5" fill="#2449e8"/>
<text x="540" y="247" class="name" style="fill:white">Coordinator</text><text x="540" y="270" class="sub" style="fill:#e0e7ff">Routes turns &amp; selects tools</text>
<rect class="node" x="942" y="216" width="186" height="74" rx="5"/>
<text x="962" y="247" class="name">Talker</text><text x="962" y="270" class="sub">Ordinary conversation</text>
<text x="815" y="239" class="small">CHAT</text><text x="649" y="333" class="small">WRITE / REVISE</text>
<rect class="node" x="520" y="366" width="228" height="74" rx="5"/>
<text x="540" y="397" class="name">Writer</text><text x="540" y="420" class="sub">Draft or rewrite</text>
<rect class="node" x="800" y="366" width="186" height="74" rx="5"/>
<text x="820" y="397" class="name">Critic</text><text x="820" y="420" class="sub">Structured review</text>
<rect class="node" x="942" y="471" width="186" height="74" rx="5"/>
<text x="962" y="502" class="name">Editor</text><text x="962" y="525" class="sub">Apply review feedback</text>
<text x="803" y="494" class="small">REVISE</text>
<text x="520" y="513" class="sub">PASS → finalize working draft</text>
<text x="520" y="541" class="small">Run identity checks reject stale or mismatched outputs.</text>
<path class="edge" d="M520 280H490V320H268V342"/>
<path class="edge" d="M268 440V464"/>
<rect class="node" x="72" y="342" width="392" height="98" rx="5"/>
<text x="92" y="375" class="name">Scoped retrieval tools</text>
<text x="92" y="402" class="sub">search_corpus → get_draft</text>
<text x="92" y="424" class="small">Load earlier writing as the active draft</text>
<rect class="node" x="72" y="464" width="392" height="81" rx="5"/>
<text x="92" y="495" class="name">Hybrid retrieval</text>
<text x="92" y="520" class="sub">Embeddings + BM25 → RRF · optional reranker</text>
<path class="edge" d="M268 545V610" stroke-dasharray="5 5"/>
<path class="edge" d="M634 290V320H1164V594H884V610" stroke-dasharray="5 5"/>
<rect class="node" x="48" y="610" width="524" height="100" rx="5"/>
<text x="72" y="644" class="name">SQLite artifact corpus</text>
<text x="72" y="671" class="sub">Immutable completed writing · paragraph-aware chunks</text>
<text x="72" y="692" class="small">Conversation and date filters apply before ranking</text>
<rect class="node" x="600" y="610" width="552" height="100" rx="5"/>
<text x="624" y="644" class="name">SQLite checkpoints</text>
<text x="624" y="671" class="sub">Conversation history + one active working draft</text>
<text x="624" y="692" class="small">Durable state across application restarts</text>
<text x="48" y="741" class="small">Simplified from the repository architecture diagram. Responses return through Telegram.</text>
</svg>
